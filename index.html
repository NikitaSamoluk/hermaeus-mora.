<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermaeus Mora</title><style>body{margin:0;background:#29241c;color:#382b1c;font:18px Georgia,serif}main{max-width:520px;margin:8px auto;padding:25px;min-height:85vh;background:radial-gradient(ellipse,#f7ecd4,#e5cda4);border:5px double #98764c;box-shadow:inset 0 0 35px #8d613955}h1{font-weight:normal}button,input,textarea{font:inherit;padding:10px;color:inherit;background:transparent;border:1px solid #9d835d}button{cursor:pointer}nav{display:flex;flex-wrap:wrap;gap:5px}input,textarea{box-sizing:border-box;width:100%;margin:6px 0}p{line-height:1.6}.line{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #a28a63;padding:16px 0}.shelf{background:#352b20;padding:12px;display:flex;gap:6px;overflow:auto;border-bottom:10px solid #785332}.book{writing-mode:vertical-rl;transform:rotate(180deg);height:180px;background:#43513b;color:#e9d4a6;border:3px double #b89b64}.center{text-align:center}hr{border:0;border-top:1px solid #9d835d}</style><main><nav id="nav"></nav><hr><section id="page"></section></main><script>const $=x=>document.getElementById(x),e=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let d={courses:[{name:'Finance',notes:[{title:'Risk premium',body:'Премия за риск — разница доходностей облигаций одинакового срока. Пример: 5.5% − 2% = 3.5 процентного пункта.'}]}],tasks:[],grades:[]};try{d=JSON.parse(localStorage.getItem('codex'))||d}catch{}let p='Home',a=0,b=0;function save(){localStorage.setItem('codex',JSON.stringify(d))}function btn(t,k){return '<button class="line" data-k="'+k+'">'+e(t)+' ›</button>'}function render(){let h='',c=d.courses[a];$('nav').innerHTML=['Home','Library','Chronicle','Trials','Oracle','Ascension'].map(x=>'<button data-k="'+x+'">'+x+'</button>').join('');if(p==='Home')h='<div class="center"><svg width="100" viewBox="0 0 100 100" fill="none" stroke="#74603e"><circle cx="50" cy="50" r="46"/><circle cx="50" cy="50" r="40" stroke-dasharray="1 4"/><path d="M10 50Q50 5 90 50Q50 95 10 50Z"/><circle cx="50" cy="50" r="15"/></svg><h1>HERMAEUS MORA</h1><p>THE BOOK OF KNOWLEDGE</p></div><hr>'+['Library','Chronicle','Trials','Oracle','Ascension'].map(x=>btn(x,x)).join('');if(p==='Library')h='<h1>The Library</h1><div class="shelf">'+d.courses.map((x,i)=>'<button class="book" data-k="c:'+i+'">'+e(x.name)+'</button>').join('')+'</div><input id="name" placeholder="Subject"><button data-k="addc">Add volume</button>';if(p==='Course')h='<h1>'+e(c.name)+'</h1>'+c.notes.map((x,i)=>btn(x.title,'n:'+i)).join('')+'<input id="name" placeholder="Chapter title"><textarea id="body" placeholder="Notes"></textarea><button data-k="addn">Add chapter</button>';if(p==='Note'){let n=c.notes[b];h=btn('Back to volume','Course')+'<h1>'+e(n.title)+'</h1><hr><p style="white-space:pre-wrap">'+e(n.body)+'</p>'}if(p==='Chronicle')h='<h1>The Chronicle</h1>'+d.tasks.map((x,i)=>btn((x.done?'✓ ':'○ ')+x.name+' · '+x.date,'t:'+i)).join('')+'<input id="name" placeholder="Task"><input id="date" type="date"><button data-k="addt">Add task</button>';if(p==='Trials')h='<h1>The Trials</h1><p>План подготовки: диагностика, теория, практика, пробный тест, разбор ошибок.</p><p>Corporate yield 5.5%, government yield 2%. Risk premium?</p>'+['2.75','3.5','7.5'].map(x=>btn(x+' p.p.','q:'+x)).join('')+'<p id="answer"></p>';if(p==='Oracle')h='<h1>The Oracle</h1><p>Local search · AI not connected</p><input id="name" placeholder="Search"><button data-k="search">Search</button><div id="results"></div>';if(p==='Ascension'){let w=d.grades.reduce((s,g)=>s+g.w,0);h='<h1>The Ascension</h1><p>Weighted average: '+(w?(d.grades.reduce((s,g)=>s+g.v*g.w,0)/w).toFixed(1)+'%':'—')+'</p>'+d.grades.map(g=>'<p>'+e(g.name)+' · '+g.v+'% / '+g.w+'%</p>').join('')+'<input id="name" placeholder="Assessment"><input id="score" type="number" placeholder="Score %"><input id="weight" type="number" placeholder="Weight %"><button data-k="addg">Add grade</button>'}$('page').innerHTML=h}document.addEventListener('click',ev=>{let t=ev.target.closest('[data-k]');if(!t)return;let [k,v]=t.dataset.k.split(':'),val=x=>$(x)?.value.trim()||'';if(['Home','Library','Chronicle','Trials','Oracle','Ascension','Course'].includes(k))p=k;else if(k==='c'){a=+v;p='Course'}else if(k==='n'){b=+v;p='Note'}else if(k==='addc'&&val('name')){d.courses.push({name:val('name'),notes:[]});a=d.courses.length-1;p='Course'}else if(k==='addn'&&val('name')&&val('body'))d.courses[a].notes.push({title:val('name'),body:val('body')});else if(k==='addt'&&val('name'))d.tasks.push({name:val('name'),date:val('date'),done:false});else if(k==='t')d.tasks[+v].done=!d.tasks[+v].done;else if(k==='q'){$('answer').textContent=v==='3.5'?'Верно!':'Попробуй ещё раз.';return}else if(k==='addg'){let w=+val('weight'),s=+val('score');if(val('name')&&val('score')&&s>=0&&s<=100&&w>0&&w+d.grades.reduce((s,g)=>s+g.w,0)<=100)d.grades.push({name:val('name'),v:s,w});else return alert('Check values')}else if(k==='search'){let q=val('name').toLowerCase();$('results').innerHTML=q?d.courses.flatMap((c,i)=>c.notes.map((n,j)=>({n,i,j}))).filter(x=>(x.n.title+' '+x.n.body).toLowerCase().includes(q)).map(x=>btn(x.n.title,'f:'+x.i+','+x.j)).join('')||'No matches':'';return}else if(k==='f'){[a,b]=v.split(',').map(Number);p='Note'}save();render()});render()</script></html>
